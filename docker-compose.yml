      - "26680:26660"
      - "26659:26657"
      - "8565:8545"
      - "8566:8546"
      - "9095:9091"
    volumes:
      - ./localnet-setup/node2/bfhevmd:/bfhevm:Z
    networks:
      - localnet
    entrypoint: /usr/bin/bfhevmd

  bfhevmdnode3:
    container_name: bfhevmdnode3
    image: "bfhmonk/bfhevm:latest"
    environment:
      - ID=3
      - LOG=${LOG:-bfhevmd.log}
