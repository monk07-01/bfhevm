      - "8555:8545"
      - "8556:8546"
      - "9094:9091"
    environment:
      - ID=1
      - LOG=${LOG:-bfhevmd.log}
    volumes:
      - ./localnet-setup/node1/bfhevmd:/bfhevm:Z
    networks:
      - localnet
    entrypoint: /usr/bin/bfhevmd

  bfhevmdnode2:
    container_name: bfhevmdnode2
    image: "bfhmonk/bfhevm:latest"
    environment:
      - ID=2
      - LOG=${LOG:-bfhevmd.log}
