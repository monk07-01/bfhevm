version: "3"

services:
  bfhevmdnode0:
    container_name: bfhevmdnode0
    image: "bfhmonk/bfhevm:latest"
    ports:
      - "26660:26660"
      - "26657:26657"
      - "8545:8545"
      - "8546:8546"
      - "9091:9091"
    environment:
      - ID=0
      - LOG=${LOG:-bfhevmd.log}
    volumes:
      - ./localnet-setup/node0/bfhevmd:/bfhevm:Z
    networks:
      - localnet
    entrypoint: /usr/bin/bfhevmd

  bfhevmdnode1:
    container_name: bfhevmdnode1
    image: "bfhmonk/bfhevm:latest"
